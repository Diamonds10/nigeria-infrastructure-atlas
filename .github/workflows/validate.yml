name: Validate public atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install validation dependencies
        run: python -m pip install pandas==2.3.3 shapely==2.1.2
      - name: Report validation environment
        run: |
          python -VV
          python -c "import pandas, shapely; print('pandas', pandas.__version__, 'shapely', shapely.__version__)"
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Validate JavaScript syntax
        run: node --check docs/assets/app.js
      - name: Validate distributed-energy contribution template
        run: >-
          python scripts/07_renewables/03_validate_distributed_energy_submission.py
          data/contributions/07_renewables/distributed_energy_submission_template.csv
          --allow-empty
      - name: Validate proposed distributed-energy contribution files
        run: >-
          find data/contributions/07_renewables -type f -name '*.csv'
          ! -name 'distributed_energy_submission_template.csv'
          -exec python
          scripts/07_renewables/03_validate_distributed_energy_submission.py
          '{}' ';'
      - name: Run release checks
        env:
          PYTHONHASHSEED: "0"
        run: python scripts/ci_run_release_checks.py

  package-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
